<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fund">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111316" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Friends Fund</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f5f6f8;--card:#ffffff;--text:#1b1f24;--muted:#626b76;--line:#e2e5e9;
  --accent:#1f7a5a;--accent-ink:#ffffff;--accent-soft:#e2f2eb;
  --danger:#b4232c;--danger-soft:#fbe6e7;--warn:#8f5b00;--warn-soft:#fcefd6;
  --chip:#eceff2;--shadow:0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111316;--card:#1a1d21;--text:#e7e9ec;--muted:#9aa3ad;--line:#2b3036;
  --accent:#43bd8e;--accent-ink:#0b1a13;--accent-soft:#173328;
  --danger:#f07780;--danger-soft:#3a1b1e;--warn:#e8b252;--warn-soft:#352a13;
  --chip:#262a30;--shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button,a,label,td.cell{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
h1{font-size:20px;margin:0}
h2{font-size:16px;margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.in{color:var(--accent)}.out{color:var(--danger)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px;flex-wrap:wrap}
header.top .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 -16px 16px;padding:0 16px;position:sticky;top:env(safe-area-inset-top);background:var(--bg);z-index:5}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 12px;color:var(--muted);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--text);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2{margin:0}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hero .label{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.hero .big{font-size:40px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.link{border:0;background:none;padding:2px 6px;color:var(--muted)}
.btn.link:hover{color:var(--text)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.act{white-space:nowrap;text-align:right;width:1%}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.due{background:var(--danger-soft);color:var(--danger)}
.chip.part{background:var(--warn-soft);color:var(--warn)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .who{font-weight:600}
.grid th,.grid td{text-align:center;padding:6px 4px}
.grid th:first-child,.grid td:first-child{text-align:left;padding-left:10px;position:sticky;left:0;background:var(--card);z-index:1;white-space:nowrap}
.grid td.cell{cursor:pointer;min-width:50px;font-size:13px;font-weight:600;border-radius:0}
.grid td.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
.cell.ok{background:var(--accent-soft);color:var(--accent)}
.cell.part{background:var(--warn-soft);color:var(--warn)}
.cell.due{background:var(--danger-soft);color:var(--danger)}
.cell.adv{background:var(--accent-soft);color:var(--accent);opacity:.75}
.cell.na{cursor:default;color:var(--line)}
.cell.na:hover{outline:none}
.cell.cur{box-shadow:inset 0 -3px 0 var(--accent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.bars .bar{margin-bottom:10px}
.bars .bar .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bars .bar .track{height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.bars .bar .fill{height:100%;background:var(--danger);border-radius:4px}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty .btn{margin-top:12px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.f2{grid-template-columns:1fr}.hero .big{font-size:34px}}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--accent)}
.crow{display:grid;grid-template-columns:24px 1fr 120px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .nm{font-weight:600}
.crow .nm small{display:block;font-weight:400;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 32px);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 34px)}
dialog .dh{padding:16px 18px 4px;font-weight:700;font-size:17px}
dialog .db{padding:12px 18px;overflow-y:auto}
dialog .df{padding:12px 18px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}
dialog .err{color:var(--danger);font-size:14px;min-height:0}
textarea.summary{min-height:260px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="fundTitle">Friends Fund</h1>
    <div class="meta"><span id="backupState"></span><button class="btn sm" data-act="backup">Download backup</button></div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="overview">Overview</button>
    <button role="tab" data-tab="collections">Collections</button>
    <button role="tab" data-tab="expenses">Expenses</button>
    <button role="tab" data-tab="ledger">Ledger</button>
    <button role="tab" data-tab="settings">Settings</button>
  </nav>
  <main id="main"></main>
</div>

<dialog id="dlg">
  <form id="dlgForm" method="dialog" novalidate>
    <div class="dh" id="dlgTitle"></div>
    <div class="db"><div id="dlgBody"></div><div class="err" id="dlgErr"></div></div>
    <div class="df">
      <button type="button" class="btn" data-act="closeDlg">Cancel</button>
      <button type="submit" class="btn primary" id="dlgSubmit">Save</button>
    </div>
  </form>
</dialog>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">
<div class="toast" id="toast"></div>

<script>
'use strict';
const KEY = 'friendsFund.v1';
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const round = n => Math.round(n * 100) / 100;
const nf = new Intl.NumberFormat('en-PK', { maximumFractionDigits: 2 });
const money = n => (n < 0 ? '−' : '') + 'Rs ' + nf.format(Math.abs(n));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sum = arr => round(arr.reduce((s, x) => s + (+x.amount || 0), 0));

function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function thisMonth() { return todayISO().slice(0, 7); }
function addMonths(m, n) {
  let [y, mo] = m.split('-').map(Number);
  mo += n; y += Math.floor((mo - 1) / 12); mo = (((mo - 1) % 12) + 12) % 12 + 1;
  return `${y}-${pad(mo)}`;
}
function monthRange(a, b) { const out = []; let m = a; while (a && b && m <= b && out.length < 1200) { out.push(m); m = addMonths(m, 1); } return out; }
function fmtMonth(m) { if (!m) return ''; const [y, mo] = m.split('-'); return `${MN[+mo - 1]} ${y}`; }
function fmtDate(d) { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${+dd} ${MN[+m - 1]} ${y}`; }
function parseAmount(v, allowZero) {
  const n = Number(String(v ?? '').replace(/[,\s]/g, ''));
  if (!Number.isFinite(n) || n < 0 || (!allowZero && n === 0) || String(v ?? '').trim() === '') return null;
  return round(n);
}

/* ---------- storage ---------- */
function defaults() {
  return { version: 1,
    settings: { fundName: 'Friends Fund', monthly: 1000, startMonth: thisMonth(), openingBalance: 0, openingDate: todayISO() },
    members: [], deposits: [], expenses: [], lastSaved: null, lastBackup: null };
}
function normalize(d) {
  const b = defaults();
  return { ...b, ...d, settings: { ...b.settings, ...(d.settings || {}) },
    members: Array.isArray(d.members) ? d.members : [],
    deposits: Array.isArray(d.deposits) ? d.deposits : [],
    expenses: Array.isArray(d.expenses) ? d.expenses : [] };
}
let storageOK = true;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); }
  catch (e) { storageOK = false; }
  return defaults();
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; }
  catch (e) { storageOK = false; toast('Could not save in this browser — download a backup now'); }
}
function save() { state.lastSaved = new Date().toISOString(); persist(); }

let state = load();
const ui = { tab: 'overview', year: +thisMonth().slice(0, 4), expQuery: '', asOf: todayISO() };

/* ---------- calculations ---------- */
const monthly = () => +state.settings.monthly || 0;
const memberName = id => (state.members.find(m => m.id === id) || {}).name || '(removed member)';
function memberFrom(mem) { const s = state.settings.startMonth; return mem.joined && mem.joined > s ? mem.joined : s; }
function activeIn(mem, m) { return m >= memberFrom(mem) && (!mem.left || m <= mem.left); }
function activeMembers(m) { return state.members.filter(x => activeIn(x, m)); }
function paidFor(id, m) { let s = 0; for (const d of state.deposits) if (d.memberId === id && d.month === m) s += d.amount; return round(s); }
function dueMonthsOf(mem) {
  const cm = thisMonth(); const to = mem.left && mem.left < cm ? mem.left : cm;
  return monthRange(memberFrom(mem), to);
}
function memberStats(mem) {
  let outstanding = 0, dueCount = 0, paid = 0, advance = 0; const cm = thisMonth();
  for (const m of dueMonthsOf(mem)) { const r = monthly() - paidFor(mem.id, m); if (r > 0.004) { outstanding += r; dueCount++; } }
  for (const d of state.deposits) if (d.memberId === mem.id) { paid += d.amount; if (d.month > cm) advance += d.amount; }
  return { paid: round(paid), outstanding: round(outstanding), dueCount, advance: round(advance) };
}
function firstUnpaid(mem) {
  let m = memberFrom(mem);
  for (let i = 0; i < 1200; i++) { if (mem.left && m > mem.left) return null; if (paidFor(mem.id, m) < monthly()) return m; m = addMonths(m, 1); }
  return null;
}
function totals() {
  const opening = +state.settings.openingBalance || 0, collected = sum(state.deposits), spent = sum(state.expenses);
  return { opening, collected, spent, balance: round(opening + collected - spent) };
}
function ledger() {
  const rank = { open: 0, in: 1, out: 2 }; const rows = [];
  const ob = +state.settings.openingBalance || 0;
  if (ob) rows.push({ date: state.settings.openingDate || '0000-00-00', kind: 'open', label: 'Opening balance', amount: ob, created: 0 });
  for (const d of state.deposits) rows.push({ date: d.date, kind: 'in', label: `${memberName(d.memberId)} — ${fmtMonth(d.month)} contribution`, note: d.note, amount: d.amount, created: d.created || 0 });
  for (const x of state.expenses) rows.push({ date: x.date, kind: 'out', label: x.description || x.category || 'Expense', cat: x.category, note: x.note, amount: -x.amount, created: x.created || 0 });
  rows.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (rank[a.kind] - rank[b.kind]) || (a.created - b.created));
  let run = 0; for (const r of rows) { run = round(run + r.amount); r.balance = run; }
  return rows;
}
function balanceOn(date) { let b = 0; for (const r of ledger()) if (r.date <= date) b = r.balance; return b; }
function monthOptions(sel, from, to, blankLabel) {
  const f = from || state.settings.startMonth, t = to || addMonths(thisMonth(), 12);
  const ms = monthRange(f < t ? f : t, t);
  if (sel && !ms.includes(sel)) ms.push(sel), ms.sort();
  return (blankLabel != null ? `<option value="">${esc(blankLabel)}</option>` : '') +
    ms.map(m => `<option value="${m}"${m === sel ? ' selected' : ''}>${fmtMonth(m)}</option>`).join('');
}

/* ---------- rendering ---------- */
function render() {
  $('#fundTitle').textContent = state.settings.fundName || 'Friends Fund';
  document.title = state.settings.fundName || 'Friends Fund';
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === ui.tab));
  $('#backupState').innerHTML = backupState();
  const views = { overview: viewOverview, collections: viewCollections, expenses: viewExpenses, ledger: viewLedger, settings: viewSettings };
  $('#main').innerHTML = (storageOK ? '' : `<div class="banner">This browser is not letting the page save data. Your entries will be lost when you close it — use <b>Download backup</b> before closing.</div>`) + views[ui.tab]();
  if (ui.tab === 'expenses') renderExpList();
  if (ui.tab === 'collections') { const g = $('.grid-wrap'); const c = g && g.querySelector('.cur'); if (c) g.scrollLeft = c.offsetLeft - 140; }
}
function backupState() {
  if (!state.lastSaved) return '';
  if (!state.lastBackup) return '<span class="chip part">No backup yet</span>';
  if (state.lastSaved > state.lastBackup) return `<span class="chip part">Changed since backup of ${fmtDate(state.lastBackup.slice(0, 10))}</span>`;
  return '<span class="chip ok">Backed up</span>';
}
function setupPrompt() {
  return `<div class="card empty"><h2>Set up your fund</h2><div>Add the friends in the group and the monthly amount, then start recording collections and expenses.</div><button class="btn primary" data-act="tab" data-tab="settings">Go to settings</button></div>`;
}

function viewOverview() {
  const t = totals(), cm = thisMonth();
  if (!state.members.length) return setupPrompt();
  const act = activeMembers(cm);
  const stats = state.members.map(m => ({ m, s: memberStats(m) }));
  const outstanding = round(stats.reduce((a, x) => a + x.s.outstanding, 0));
  const paidCount = act.filter(m => paidFor(m.id, cm) >= monthly()).length;
  const recent = ledger().reverse().slice(0, 6);
  return `
  <section class="card hero">
    <div><div class="label">Money in the fund</div><div class="big ${t.balance < 0 ? 'out' : ''}">${money(t.balance)}</div>
      <div class="muted small">${t.opening ? `Opening ${money(t.opening)} + ` : ''}collected ${money(t.collected)} − spent ${money(t.spent)}</div></div>
    <div class="row"><button class="btn" data-act="summary">Share summary</button><button class="btn" data-act="addExpense">Add expense</button><button class="btn primary" data-act="collect">Record collection</button></div>
  </section>
  <div class="stats">
    <div class="stat"><div class="k">Total collected</div><div class="v in">${money(t.collected)}</div></div>
    <div class="stat"><div class="k">Total spent</div><div class="v out">${money(t.spent)}</div></div>
    <div class="stat"><div class="k">Pending dues</div><div class="v">${money(outstanding)}</div></div>
    <div class="stat"><div class="k">${fmtMonth(cm)} paid</div><div class="v">${paidCount} / ${act.length}</div></div>
  </div>
  <section class="card">
    <div class="card-head"><h2>${fmtMonth(cm)} — ${money(monthly())} each</h2></div>
    <ul class="list">${act.map(m => {
      const p = paidFor(m.id, cm), left = round(monthly() - p);
      const chip = left <= 0 ? '<span class="chip ok">Paid</span>' : p > 0 ? `<span class="chip part">${money(left)} left</span>` : '<span class="chip due">Not paid</span>';
      return `<li><span class="who">${esc(m.name)}</span><span class="row">${chip}${left > 0 ? `<button class="btn sm" data-act="quickPay" data-id="${m.id}" data-month="${cm}">Record</button>` : ''}</span></li>`;
    }).join('') || '<li class="muted">No active members this month.</li>'}</ul>
  </section>
  <section class="card">
    <div class="card-head"><h2>Members</h2></div>
    <div class="tw"><table><thead><tr><th>Name</th><th class="num">Total paid</th><th class="num">Pending</th><th></th></tr></thead><tbody>
    ${stats.map(({ m, s }) => `<tr><td><b>${esc(m.name)}</b>${m.left ? ` <span class="chip">left ${fmtMonth(m.left)}</span>` : ''}</td><td class="num">${money(s.paid)}</td>
      <td class="num">${s.outstanding > 0 ? `<span class="out">${money(s.outstanding)}</span> <span class="muted small">(${s.dueCount} mo)</span>` : s.advance > 0 ? `<span class="in">${money(s.advance)} ahead</span>` : '<span class="muted">—</span>'}</td>
      <td class="act">${s.outstanding > 0 ? `<button class="btn sm" data-act="quickPay" data-id="${m.id}">Record</button>` : ''}</td></tr>`).join('')}
    </tbody></table></div>
  </section>
  <section class="card">
    <div class="card-head"><h2>Recent activity</h2><button class="btn link" data-act="tab" data-tab="ledger">Full ledger →</button></div>
    ${recent.length ? `<ul class="list">${recent.map(r => `<li><span><span class="who">${esc(r.label)}</span><br><span class="muted small">${fmtDate(r.date)}${r.cat ? ' · ' + esc(r.cat) : ''}</span></span><span class="num ${r.amount < 0 ? 'out' : 'in'}">${r.amount < 0 ? '−' : '+'}${money(Math.abs(r.amount))}</span></li>`).join('')}</ul>` : '<div class="muted">Nothing recorded yet.</div>'}
  </section>`;
}

function viewCollections() {
  if (!state.members.length) return setupPrompt();
  const y = ui.year, cm = thisMonth(), months = MN.map((_, i) => `${y}-${pad(i + 1)}`);
  const rows = state.members.filter(m => months.some(mo => activeIn(m, mo)));
  const deps = state.deposits.filter(d => d.month.startsWith(y + '-') || d.date.startsWith(y + '-'))
    .sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));
  const minY = +state.settings.startMonth.slice(0, 4), maxY = +addMonths(cm, 12).slice(0, 4);
  const cell = (m, mo) => {
    if (!activeIn(m, mo)) return `<td class="cell na">·</td>`;
    const p = paidFor(m.id, mo), cls = mo === cm ? ' cur' : '';
    const attrs = `data-act="cell" data-id="${m.id}" data-month="${mo}" title="${esc(m.name)} · ${fmtMonth(mo)}: ${money(p)} of ${money(monthly())}"`;
    if (p >= monthly() && p > 0) return `<td class="cell ${mo > cm ? 'adv' : 'ok'}${cls}" ${attrs}>✓</td>`;
    if (p > 0) return `<td class="cell part${cls}" ${attrs}>${nf.format(p)}</td>`;
    if (mo <= cm) return `<td class="cell due${cls}" ${attrs}>✕</td>`;
    return `<td class="cell${cls}" ${attrs}></td>`;
  };
  return `
  <section class="card">
    <div class="card-head">
      <div class="row"><button class="btn sm" data-act="year" data-d="-1" ${y <= minY ? 'disabled' : ''} aria-label="Previous year">‹</button><h2 style="margin:0 6px">${y}</h2><button class="btn sm" data-act="year" data-d="1" ${y >= maxY ? 'disabled' : ''} aria-label="Next year">›</button></div>
      <button class="btn primary" data-act="collect">Record collection</button>
    </div>
    <div class="tw grid-wrap"><table class="grid"><thead><tr><th>Member</th>${months.map(mo => `<th>${MN[+mo.slice(5) - 1]}</th>`).join('')}<th class="num">Paid ${y}</th></tr></thead><tbody>
      ${rows.map(m => `<tr><td><b>${esc(m.name)}</b></td>${months.map(mo => cell(m, mo)).join('')}<td class="num">${money(round(months.reduce((a, mo) => a + paidFor(m.id, mo), 0)))}</td></tr>`).join('') || `<tr><td colspan="14" class="muted">No members active in ${y}.</td></tr>`}
    </tbody></table></div>
    <div class="legend"><span><i style="background:var(--accent-soft)"></i>Paid</span><span><i style="background:var(--warn-soft)"></i>Partly paid (amount shown)</span><span><i style="background:var(--danger-soft)"></i>Due</span><span>Tap a box to record a payment</span></div>
  </section>
  <section class="card">
    <div class="card-head"><h2>Payments recorded in ${y}</h2><span class="muted small">${deps.length} payment${deps.length === 1 ? '' : 's'} · ${money(sum(deps))}</span></div>
    ${deps.length ? `<div class="tw"><table><thead><tr><th>Date received</th><th>Member</th><th>For month</th><th class="num">Amount</th><th></th></tr></thead><tbody>
      ${deps.map(d => `<tr><td style="white-space:nowrap">${fmtDate(d.date)}</td><td>${esc(memberName(d.memberId))}${d.note ? `<div class="muted small">${esc(d.note)}</div>` : ''}</td><td style="white-space:nowrap">${fmtMonth(d.month)}</td><td class="num in">${money(d.amount)}</td>
      <td class="act"><button class="btn link" data-act="editDep" data-id="${d.id}">Edit</button><button class="btn link" data-act="delDep" data-id="${d.id}">Delete</button></td></tr>`).join('')}
    </tbody></table></div>` : '<div class="muted">No payments recorded for this year.</div>'}
  </section>`;
}

function viewExpenses() {
  const t = totals(), cm = thisMonth();
  const monthSpent = sum(state.expenses.filter(x => x.date.startsWith(cm)));
  const byCat = {};
  for (const x of state.expenses) { const c = x.category || 'Other'; byCat[c] = round((byCat[c] || 0) + x.amount); }
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const max = cats.length ? cats[0][1] : 1;
  return `
  <div class="stats">
    <div class="stat"><div class="k">Total spent</div><div class="v out">${money(t.spent)}</div></div>
    <div class="stat"><div class="k">Spent in ${fmtMonth(cm)}</div><div class="v">${money(monthSpent)}</div></div>
    <div class="stat"><div class="k">Left in fund</div><div class="v ${t.balance < 0 ? 'out' : ''}">${money(t.balance)}</div></div>
  </div>
  ${cats.length ? `<section class="card"><h2>Where the money went</h2><div class="bars">${cats.map(([c, v]) => `
    <div class="bar"><div class="t"><span>${esc(c)}</span><span class="num">${money(v)} <span class="muted small">${t.spent ? Math.round(v / t.spent * 100) : 0}%</span></span></div><div class="track"><div class="fill" style="width:${Math.max(2, v / max * 100)}%"></div></div></div>`).join('')}</div></section>` : ''}

    <div class="card-head"><h2>Expenses</h2><button class="btn primary" data-act="addExpense">Add expense</button></div>

}

/* ---------- dialogs ---------- */
let onSubmit = null;
function openDialog(title, body, submitFn, submitLabel = 'Save') {
  $('#dlgTitle').textContent = title; $('#dlgBody').innerHTML = body; $('#dlgErr').textContent = '';
  $('#dlgSubmit').textContent = submitLabel; $('#dlgSubmit').classList.toggle('hidden', !submitFn);
  onSubmit = submitFn; $('#dlg').showModal();
}
$('#dlgForm').addEventListener('submit', e => {
  e.preventDefault(); if (!onSubmit) return $('#dlg').close();
  const err = onSubmit(new FormData(e.target));
  if (err) { $('#dlgErr').textContent = err; return; }
  $('#dlg').close(); save(); render();
});

function collectDialog(month) {
  month = month || thisMonth();
  const rowsFor = mo => {
    const act = activeMembers(mo);
    if (!act.length) return '<div class="muted">No members are active in this month.</div>';
    return act.map(m => {
      const left = round(monthly() - paidFor(m.id, mo));
      return `<label class="crow"><input type="checkbox" name="chk" value="${m.id}" ${left > 0 ? 'checked' : ''}>
        <span class="nm">${esc(m.name)}<small>${left <= 0 ? 'Already paid' : left < monthly() ? `${money(left)} remaining` : 'Not paid yet'}</small></span>
        <input name="amt_${m.id}" inputmode="decimal" value="${left > 0 ? left : monthly()}" aria-label="Amount from ${esc(m.name)}"></label>`;
    }).join('');
  };
  openDialog('Record collection', `
    <div class="f2">
      <label class="f"><span>For month</span><select name="month" id="colMonth">${monthOptions(month)}</select></label>
      <label class="f"><span>Date received</span><input type="date" name="date" value="${todayISO()}"></label>
    </div>
    <div class="muted small" style="margin-bottom:4px">Tick everyone who paid and check the amount.</div>
    <div id="colRows">${rowsFor(month)}</div>`, fd => {
      const mo = fd.get('month'), date = fd.get('date'), ids = fd.getAll('chk');
      if (!date) return 'Enter the date the money was received.';
      if (!ids.length) return 'Tick at least one member.';
      const adds = [];
      for (const id of ids) {
        const a = parseAmount(fd.get('amt_' + id));
        if (a == null) return `Enter a valid amount for ${memberName(id)}.`;
        adds.push({ id: uid(), memberId: id, month: mo, date, amount: a, note: '', created: Date.now() });
      }
      state.deposits.push(...adds);
      toast(`Recorded ${adds.length} payment${adds.length > 1 ? 's' : ''} · ${money(sum(adds))}`);
    }, 'Record');
  $('#colMonth').addEventListener('change', e => { $('#colRows').innerHTML = rowsFor(e.target.value); });
}

function depositDialog(dep, preset = {}) {
  const d = dep || { memberId: preset.memberId, month: preset.month, amount: preset.amount, date: todayISO(), note: '' };
  openDialog(dep ? 'Edit payment' : 'Record payment', `
    <label class="f"><span>Member</span><select name="memberId">${state.members.map(m => `<option value="${m.id}"${m.id === d.memberId ? ' selected' : ''}>${esc(m.name)}</option>`).join('')}</select></label>
    <div class="f2">
      <label class="f"><span>For month</span><select name="month">${monthOptions(d.month)}</select></label>
      <label class="f"><span>Amount (Rs)</span><input name="amount" inputmode="decimal" value="${d.amount ?? ''}"></label>
    </div>
    <label class="f"><span>Date received</span><input type="date" name="date" value="${d.date}"></label>
    <label class="f"><span>Note (optional)</span><input name="note" value="${esc(d.note)}" placeholder="e.g. paid by bank transfer"></label>`, fd => {
      const amount = parseAmount(fd.get('amount'));
      if (amount == null) return 'Enter a valid amount.';
      if (!fd.get('date')) return 'Enter the date the money was received.';
      const rec = { memberId: fd.get('memberId'), month: fd.get('month'), amount, date: fd.get('date'), note: fd.get('note').trim() };
      if (dep) Object.assign(dep, rec); else state.deposits.push({ id: uid(), created: Date.now(), ...rec });
      toast(dep ? 'Payment updated' : `Recorded ${money(amount)} from ${memberName(rec.memberId)}`);
    });
}

  const cats = [...new Set(['Food', 'Outing', 'Gift', 'Emergency', 'Loan', ...state.expenses.map(v => v.category).filter(Boolean)])];

    <label class="f"><span>What was it for?</span><input name="description" value="${esc(e.description)}" placeholder="e.g. Dinner at Monal"></label>
    <div class="f2">

      <label class="f"><span>Date</span><input type="date" name="date" value="${e.date}"></label>

    <label class="f"><span>Note (optional)</span><input name="note" value="${esc(e.note)}" placeholder="e.g. paid to, who approved, receipt"></label>

      const amount = parseAmount(fd.get('amount'));

      toast(x ? 'Expense updated' : `Expense added · ${money(b)} left`);

function memberDialog(m) {
  const v = m || { name: '', joined: state.settings.startMonth, left: '' };
  const from = state.settings.startMonth < thisMonth() ? state.settings.startMonth : thisMonth();
  openDialog(m ? 'Edit member' : 'Add member', `
    <label class="f"><span>Name</span><input name="name" value="${esc(v.name)}" autocomplete="off"></label>
    <div class="f2">
      <label class="f"><span>Pays from</span><select name="joined">${monthOptions(memberFrom(v), from)}</select></label>
      <label class="f"><span>Left the group after</span><select name="left">${monthOptions(v.left, from, null, 'Still a member')}</select></label>
    </div>`, fd => {
      const name = fd.get('name').trim();
      if (!name) return 'Enter a name.';
      if (state.members.some(o => o !== m && o.name.toLowerCase() === name.toLowerCase())) return 'There is already a member with that name.';
      const rec = { name, joined: fd.get('joined'), left: fd.get('left') };
      if (rec.left && rec.left < rec.joined) return '"Left" month cannot be before the "pays from" month.';
      if (m) Object.assign(m, rec); else state.members.push({ id: uid(), ...rec });
    });
}

function summaryDialog() {
  const t = totals(), cm = thisMonth(), L = [];
  L.push(`*${state.settings.fundName}* — ${fmtDate(todayISO())}`, '', `💰 Money in fund: *${money(t.balance)}*`);
  if (t.opening) L.push(`Opening balance: ${money(t.opening)}`);
  L.push(`Total collected: ${money(t.collected)}`, `Total spent: ${money(t.spent)}`, '', `*${fmtMonth(cm)} collection* (${money(monthly())} each)`);
  for (const m of activeMembers(cm)) {
    const p = paidFor(m.id, cm);
    L.push(p >= monthly() ? `✅ ${m.name}` : p > 0 ? `🟡 ${m.name} — ${money(round(monthly() - p))} left` : `❌ ${m.name}`);
  }
  const owing = state.members.map(m => [m, memberStats(m)]).filter(([, s]) => s.outstanding > 0);
  if (owing.length) { L.push('', '*Pending dues*'); for (const [m, s] of owing) L.push(`${m.name}: ${money(s.outstanding)} (${s.dueCount} month${s.dueCount > 1 ? 's' : ''})`); }
  const recent = state.expenses.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);
  if (recent.length) { L.push('', '*Recent expenses*'); for (const x of recent) L.push(`${fmtDate(x.date)} — ${x.description}: ${money(x.amount)}`); }
  const text = L.join('\n');
  openDialog('Share summary', `<div class="muted small" style="margin-bottom:8px">Send this to your group chat.</div><textarea class="summary" readonly id="sumText">${esc(text)}</textarea>`, null);
  $('#dlgSubmit').classList.remove('hidden'); $('#dlgSubmit').textContent = navigator.share ? 'Share' : 'Copy';
  onSubmit = () => {
    if (navigator.share) { navigator.share({ text }).catch(() => {}); return; }
    const ta = $('#sumText');
    const done = () => toast('Summary copied');
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => { ta.select(); document.execCommand('copy'); done(); });
    else { ta.select(); document.execCommand('copy'); done(); }
  };
}

/* ---------- files ---------- */
async function download(name, content, type) {
  try {
    const file = new File([content], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) { if (e.name === 'AbortError') return false; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  return true;
}
function slug() { return (state.settings.fundName || 'fund').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'fund'; }
async function exportBackup() {
  const stamp = new Date().toISOString();
  const data = { ...state, lastBackup: stamp, lastSaved: state.lastSaved || stamp };
  if (!(await download(`${slug()}-backup-${todayISO()}.json`, JSON.stringify(data, null, 2), 'application/json'))) return;
  state.lastBackup = stamp; if (!state.lastSaved) state.lastSaved = stamp;
  persist(); render(); toast('Backup saved — keep the file somewhere safe');
}
function exportCSV() {
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [['Date', 'Type', 'Details', 'Category', 'Note', 'In (Rs)', 'Out (Rs)', 'Balance (Rs)'].join(',')];
  for (const r of ledger()) lines.push([r.date, r.kind === 'out' ? 'Expense' : r.kind === 'in' ? 'Contribution' : 'Opening', r.label, r.cat || '', r.note || '', r.amount > 0 ? r.amount : '', r.amount < 0 ? -r.amount : '', r.balance].map(q).join(','));
  download(`${slug()}-ledger-${todayISO()}.csv`, '﻿' + lines.join('\r\n'), 'text/csv');
}
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  f.text().then(txt => {
    let d; try { d = JSON.parse(txt); } catch (_) { return alert('That file is not a valid backup.'); }
    if (!d || !Array.isArray(d.members) || !Array.isArray(d.deposits) || !Array.isArray(d.expenses)) return alert('That file is not a backup from this app.');
    const when = d.lastBackup ? ` made on ${fmtDate(d.lastBackup.slice(0, 10))}` : '';
    if (!confirm(`Replace everything in this browser with the backup${when}?\n\n${d.members.length} members · ${d.deposits.length} payments · ${d.expenses.length} expenses`)) return;
    state = normalize(d); persist(); ui.tab = 'overview'; render(); toast('Backup restored');
  });
});

/* ---------- events ---------- */
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500); }

document.addEventListener('click', e => {
  const tab = e.target.closest('nav.tabs button');
  if (tab) { ui.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id, find = (arr) => arr.find(x => x.id === id);
  switch (b.dataset.act) {
    case 'tab': ui.tab = b.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'closeDlg': $('#dlg').close(); break;
    case 'collect': collectDialog(); break;
    case 'quickPay': case 'cell': {
      const m = find(state.members), mo = b.dataset.month || firstUnpaid(m) || thisMonth();
      const left = round(monthly() - paidFor(id, mo));
      depositDialog(null, { memberId: id, month: mo, amount: left > 0 ? left : monthly() }); break;
    }
    case 'editDep': depositDialog(find(state.deposits)); break;
    case 'delDep': { const d = find(state.deposits);
      if (confirm(`Delete ${money(d.amount)} from ${memberName(d.memberId)} for ${fmtMonth(d.month)}?`)) { state.deposits = state.deposits.filter(x => x !== d); save(); render(); toast('Payment deleted'); } break; }
    case 'addExpense': expenseDialog(); break;
    case 'editExp': expenseDialog(find(state.expenses)); break;
    case 'delExp': { const x = find(state.expenses);
      if (confirm(`Delete expense "${x.description}" (${money(x.amount)})?`)) { state.expenses = state.expenses.filter(v => v !== x); save(); render(); toast('Expense deleted'); } break; }
    case 'year': ui.year += +b.dataset.d; render(); break;
    case 'addMember': memberDialog(); break;
    case 'editMember': memberDialog(find(state.members)); break;
    case 'delMember': { const m = find(state.members);
      if (state.deposits.some(d => d.memberId === id)) { alert(`${m.name} has payments recorded, so they can't be removed without changing the totals.\n\nIf they left the group, edit them and set "Left the group after" instead.`); break; }
      if (confirm(`Remove ${m.name}?`)) { state.members = state.members.filter(x => x !== m); save(); render(); } break; }
    case 'summary': summaryDialog(); break;
    case 'backup': exportBackup(); break;
    case 'csv': exportCSV(); break;
    case 'import': $('#importFile').click(); break;
    case 'reset':
      if (prompt('This erases every member, payment and expense in this browser. Download a backup first if unsure.\n\nType ERASE to confirm.') === 'ERASE') {
        state = defaults(); persist(); ui.tab = 'settings'; render(); toast('All data erased');
      } break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'expSearch') { ui.expQuery = e.target.value; renderExpList(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'asOf') { ui.asOf = e.target.value || todayISO(); $('#asOfVal').textContent = money(balanceOn(ui.asOf)); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'settingsForm') return;
  e.preventDefault();
  const fd = new FormData(e.target), err = msg => { $('#settingsErr').textContent = msg; };
  const fundName = fd.get('fundName').trim(), m = parseAmount(fd.get('monthly'));
  const sm = fd.get('startMonth').trim(), ob = Number(String(fd.get('openingBalance')).replace(/[,\s]/g, '') || 0);
  if (!fundName) return err('Enter a fund name.');
  if (m == null) return err('Enter the monthly amount.');
  if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(sm)) return err('Start month must look like 2026-01.');
  if (!Number.isFinite(ob)) return err('Opening balance must be a number.');
  Object.assign(state.settings, { fundName, monthly: m, startMonth: sm, openingBalance: round(ob), openingDate: fd.get('openingDate') || todayISO() });
  save(); render(); toast('Settings saved');
});
window.addEventListener('beforeunload', e => {
  if (state.lastSaved && (!state.lastBackup || state.lastSaved > state.lastBackup) && !storageOK) { e.preventDefault(); e.returnValue = ''; }
});

render();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
